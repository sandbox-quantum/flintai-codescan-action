name: FlintAI AI-SPM Inventory Scan
description: Scans the repository contents for AI usage and reports findings back to FlintAI.
author: SB Technology Inc.
branding:
  icon: alert-triangle
  color: yellow
inputs:
  flint_instance:
    description: URL of your FlintAI instance
    required: true
  flint_token:
    description: API key for your FlintAI instance
    required: true
runs:
  using: composite
  steps:
      - run: echo "Job triggered by ${{ github.event_name }}, running on ${{ github.repository }} @ ${{ github.ref }}"
        shell: bash
      - name: Check out repository
        uses: actions/checkout@v5

      # Download the scanner image as a tar, authenticating with the FlintAI API
      # key. The /downloads endpoint replies with a 303 redirect to a presigned
      # S3 URL, so -L is required to follow it. The API key must be sent with the
      # "ApiKey" scheme (not "Bearer").
      - name: Download Docker image
        env:
          FLINT_INSTANCE: ${{ inputs.flint_instance }}
          FLINT_TOKEN: ${{ inputs.flint_token }}
        run: 'curl -s -L --output image.tar "$FLINT_INSTANCE/downloads/sensors/aispm_inventory_scanner/1.0.0" -H "Authorization: ApiKey $FLINT_TOKEN"'
        shell: bash

      # Load image into the local docker cache
      - name: Load Docker image
        run: docker load --input image.tar
        shell: bash

      # Tag the image, so it doesn't try and pull it from the web (and then we reference the tag subsequently)
      - name: Tag image
        run: docker tag bazel/services/aispm_inventory:latest aispm-action-test:latest
        shell: bash

      # The usual way would be doing this via "uses: docker://image:tag" but that doesn't work with local images
      # since GH Actions tries to pull them from the web. So we run it manually here.
      # The scanner container reads AQG_TOKEN / AQG_INSTANCE, so the FlintAI inputs
      # are mapped onto those env var names here.
      - name: Run AI SPM scanner container
        env:
          FLINT_INSTANCE: ${{ inputs.flint_instance }}
          FLINT_TOKEN: ${{ inputs.flint_token }}
        run: docker run --rm -e "HOME" -e GITHUB_WORKSPACE="/github/workspace" -e GITHUB_WORKFLOW -e GITHUB_ACTION -e GITHUB_ACTOR -e GITHUB_EVENT_NAME -e GITHUB_REPOSITORY -e GITHUB_REF -e GITHUB_SHA -e AQG_TOKEN="$FLINT_TOKEN" -e AQG_INSTANCE="$FLINT_INSTANCE" -v "/home/runner/work/_temp/_github_home":"/github/home" -v "/home/runner/work/_temp/_github_workflow":"/github/workflow" -v "/home/runner/work/_temp/_runner_file_commands":"/github/file_commands" -v $GITHUB_WORKSPACE:"/github/workspace" aispm-action-test:latest
        shell: bash
